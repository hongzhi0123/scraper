<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Site 1 - Data Table</title>
    <style>
        table.data-table {
            border-collapse: collapse;
            width: 100%;
        }

        table.data-table th,
        table.data-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        table.data-table th {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>

    <h1>User Directory</h1>

    <table class="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Address</th>
                <th>City</th>
                <th>Country</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>28</td>
                <td>some address</td>
                <td>Berlin</td>
                <td>Germany</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>34</td>
                <td>some address</td>
                <td>Munich</td>
                <td>Germany</td>
            </tr>
            <tr>
                <td>Max Thieler</td>
                <td>19</td>
                <td>some address</td>
                <td>London</td>
                <td>UK</td>
            </tr>
            <tr>
                <td>Clara Müller</td>
                <td>22</td>
                <td>some address</td>
                <td>Hamburg</td>
                <td>Germany</td>
            </tr>
            <tr>
                <td>David Klein</td>
                <td>45</td>
                <td>some address</td>
                <td>Cologne</td>
                <td>Germany</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
